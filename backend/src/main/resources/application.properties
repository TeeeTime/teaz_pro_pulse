spring.application.name=pulse

# Errors as RFC 9457 problem details, so the UI can show their "detail" (e.g. why a stop was refused).
spring.mvc.problemdetails.enabled=true

# Docker Engine API base URL. Unset = MockDockerClient with fake containers (local dev).
# To try against a real engine locally, e.g. Docker Desktop's TCP endpoint:
# pulse.docker.url=http://localhost:2375
pulse.docker.api-version=v1.44
