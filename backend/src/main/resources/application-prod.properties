# Activate with SPRING_PROFILES_ACTIVE=prod.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://auth.teaz.pro/realms/teazpro

# The socket proxy from compose.yml; it only allows the calls Pulse makes.
pulse.docker.url=http://docker-proxy:2375

# Apps allowed to read /api/health and /api/load from the browser (comma-separated).
pulse.cors.allowed-origins=https://portal.teaz.pro
